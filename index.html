<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rainmaker terrain panes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css" rel="stylesheet">
<style>
@font-face { font-family: "Founders"; src: url("webfonts/TestFoundersGroteskText-Regular.otf"); }
@font-face { font-family: "Founders"; font-weight: bold;
  src: url("webfonts/TestFoundersGroteskText-Semibold.otf"); }
:root { --forest: #1C2C26; --pine: #103D1D; --mist: #F5F5F1; --grain: #FFF1CF; }
html, body { margin: 0; height: 100%; }
#grid { display: grid; height: 100%;
  grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px;
  background: var(--forest); }
.pane { position: relative; background: var(--mist); }
.tag { position: absolute; z-index: 5; top: 8px; left: 8px;
  background: rgba(28, 44, 38, 0.92); color: var(--mist);
  font: bold 12px/1.35 Founders, "Founders Grotesk", "Segoe UI", sans-serif;
  letter-spacing: 0.02em; padding: 6px 9px; max-width: 46%; }
.maplibregl-ctrl-attrib { font-size: 10px; }
@media (max-width: 700px) { #grid { grid-template-columns: 1fr;
  grid-template-rows: repeat(4, 1fr); } }
</style>
</head>
<body>
<div id="grid">
  <div class="pane"><div id="m1" style="position:absolute;inset:0"></div><div class="tag">ArcGIS Toolbox-output hillshade: most detail, but have to generate for specific viewports</div></div>
  <div class="pane"><div id="m2" style="position:absolute;inset:0"></div><div class="tag">ArcGIS Online Map Style A</div></div>
  <div class="pane"><div id="m3" style="position:absolute;inset:0"></div><div class="tag">ArcGIS Online Map Style B</div></div>
  <div class="pane"><iframe id="m4" src="https://pub-3d83d6d0af15490b9d88464bd8f8c67f.r2.dev/index.html"
    style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe>
    <div class="tag">Protomaps self-hosted style</div>
    <div class="maplibregl-ctrl maplibregl-ctrl-group" style="position:absolute;top:10px;right:10px;z-index:5">
      <button class="maplibregl-ctrl-zoom-in" type="button" title="Zoom in" aria-label="Zoom in"
        onclick="m2.zoomIn()"><span class="maplibregl-ctrl-icon" aria-hidden="true"></span></button>
      <button class="maplibregl-ctrl-zoom-out" type="button" title="Zoom out" aria-label="Zoom out"
        onclick="m2.zoomOut()"><span class="maplibregl-ctrl-icon" aria-hidden="true"></span></button>
    </div></div>
</div>
<script>
const HOST = location.origin + location.pathname.replace(/[^/]*$/, "");
let START = { center: [-111.78, 40.55], zoom: 11 };
const hm = location.hash.match(/^#(\d+\.?\d*)\/(-?\d+\.?\d*)\/(-?\d+\.?\d*)/);
if (hm) START = { zoom: +hm[1], center: [+hm[3], +hm[2]] };
const GRAPHITE_BOUNDS = [-112.1557, 40.183, -111.4732, 40.834];

// credits stay behind the (i) button until someone clicks it
function quietCredits(map, text) {
  map.addControl(new maplibregl.AttributionControl({ compact: true, customAttribution: text }));
  const fold = () => {
    const el = map.getContainer().querySelector(".maplibregl-ctrl-attrib");
    if (el) { el.classList.remove("maplibregl-compact-show"); el.removeAttribute("open"); }
  };
  fold();
  map.once("load", fold);
}

// graphite pane: baked raster underlay (Pro's own render of the toolbox
// stack) with everything vector drawn LIVE on top: Rainmaker Waterbodies and
// Hydro, then the Rainmaker Labels style (roads, shields, every label)
const getJSON = name => fetch(HOST + "styles/" + name + ".json").then(r => r.json());
const m1ready = Promise.all([getJSON("rainmaker_labels"), getJSON("rainmaker_waterbodies"),
                             getJSON("rainmaker_hydro")])
  .then(([ls, wb, hy]) => {
    // the toolbox holds its water at 75% inside the Custom Basemap group
    const WOP = 0.75;
    const fade = v => v === undefined ? WOP : typeof v === "number" ? v * WOP
      : (v && v.stops ? Object.assign({}, v, { stops: v.stops.map(s => [s[0], s[1] * WOP]) }) : v);
    const water = [];
    [["wb", wb], ["hy", hy]].forEach(([tag, st]) => st.layers.forEach(L => {
      if ((L.layout || {}).visibility === "none") return;
      if (L.type !== "fill" && L.type !== "line") return;
      const C = JSON.parse(JSON.stringify(L));
      C.id = tag + ":" + L.id;
      C.paint = C.paint || {};
      const key = L.type === "fill" ? "fill-opacity" : "line-opacity";
      C.paint[key] = fade(C.paint[key]);
      water.push(C);
    }));
    // thicken only the small roads (local, minor, service, 4WD) over the relief
    const K = 2.2;
    const scaleW = v => typeof v === "number" ? v * K
      : (v && v.stops ? Object.assign({}, v, { stops: v.stops.map(s => [s[0], s[1] * K]) }) : v);
    ls.layers.forEach(L => {
      if (L.type === "line" && /^Road( tunnel)?\/(Local|Minor|Service|4WD)/.test(L.id)
          && L.paint && L.paint["line-width"])
        L.paint["line-width"] = scaleW(L.paint["line-width"]);
    });
    const style = {
      version: 8, glyphs: ls.glyphs, sprite: ls.sprite,
      sources: Object.assign({
        g: { type: "raster", tiles: [HOST + "tiles/graphite/{z}/{x}/{y}.webp"],
             tileSize: 256, minzoom: 9, maxzoom: 14, bounds: GRAPHITE_BOUNDS }
      }, ls.sources),
      layers: [
        { id: "bg", type: "background", paint: { "background-color": "#F5F5F1" } },
        { id: "g", type: "raster", source: "g" },
        ...water,
        ...ls.layers
      ]
    };
    const m = new maplibregl.Map({ container: "m1", center: START.center,
      zoom: START.zoom, attributionControl: false, style });
    quietCredits(m, "Esri World Imagery, USGS 3DEP, Esri Community Maps");
    m.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
    return m;
  });
const m2 = new maplibregl.Map({ container: "m2", center: START.center,
  zoom: START.zoom, attributionControl: false,
  style: HOST + "styles/rainmaker_hiking_relief_test.json" });
const m3 = new maplibregl.Map({ container: "m3", center: START.center,
  zoom: START.zoom, attributionControl: false,
  style: HOST + "styles/rainmaker_topo_relief_test.json" });
quietCredits(m2, "Esri, USGS");
m2.on("moveend", () => {
  const c = m2.getCenter();
  history.replaceState(null, "",
    "#" + m2.getZoom().toFixed(2) + "/" + c.lat.toFixed(5) + "/" + c.lng.toFixed(5));
});
quietCredits(m3, "Esri, USGS");
m2.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
m3.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");

// pan/zoom link, the iframed Protomaps pane included (rm:view postMessage)
m1ready.then(m1 => {
  const maps = [m1, m2, m3];
  const frame = document.getElementById("m4");
  let lock = false;
  const toFrame = (c, z) => frame.contentWindow &&
    frame.contentWindow.postMessage({ type: "rm:view", lon: c.lng, lat: c.lat, zoom: z }, "*");
  maps.forEach(src => {
    src.on("move", () => {
      if (lock) return;
      lock = true;
      const c = src.getCenter(), z = src.getZoom(), b = src.getBearing(), p = src.getPitch();
      maps.forEach(dst => {
        if (dst !== src) dst.jumpTo({ center: c, zoom: z, bearing: b, pitch: p });
      });
      toFrame(c, z);
      lock = false;
    });
  });
  window.addEventListener("message", e => {
    const d = e.data || {};
    if (d.type !== "rm:view" || lock) return;
    lock = true;
    maps.forEach(m => m.jumpTo({ center: [d.lon, d.lat], zoom: d.zoom }));
    lock = false;
  });
  frame.addEventListener("load", () => toFrame(m2.getCenter(), m2.getZoom()));
  toFrame(m2.getCenter(), m2.getZoom());
  setTimeout(() => toFrame(m2.getCenter(), m2.getZoom()), 2000);
});
</script>
</body>
</html>
